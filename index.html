<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Primary Tags -->
    <title>Eco Aventura - Gestión de Alquileres en Tiempo Real</title>
    <meta name="title" content="Eco Aventura - Gestión de Alquileres en Tiempo Real" />
    <meta name="description" content="Gestor PWA Mobile-First en tiempo real para alquiler temporal de rodados y bienes náuticos en Eco Aventura." />
    <meta name="theme-color" content="#FAF5E4" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Social Share Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ecoaventura.vercel.app/" />
    <meta property="og:title" content="Eco Aventura - Gestión de Alquileres en Tiempo Real" />
    <meta property="og:description" content="Gestor PWA Mobile-First en tiempo real para alquiler temporal de rodados, bienes náuticos y tickets de parque en Eco Aventura." />
    <meta property="og:image" content="https://ecoaventura.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eco Aventura - Gestión de Alquileres en Tiempo Real" />
    <meta name="twitter:description" content="Gestor PWA Mobile-First en tiempo real para alquiler temporal de rodados, bienes náuticos y tickets de parque en Eco Aventura." />
    <meta name="twitter:image" content="https://ecoaventura.vercel.app/og-image.jpg" />

    <!-- Mobile Web App Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Eco Aventura" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Typography (Fraunces Display + Hanken Grotesk Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-[#FAF5E4] text-eco-dark antialiased selection:bg-eco-gold selection:text-eco-dark font-sans">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
